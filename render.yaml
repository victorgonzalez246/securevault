# Blueprint de Render (despliegue reproducible). Los secretos (sync: false) se
# ingresan en el panel de Render al crear el servicio; NUNCA van en este archivo.
# APP_ORIGIN no hace falta: la app usa RENDER_EXTERNAL_URL, que Render define solo.
services:
  - type: web
    name: securevault
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "2" # Cloudflare + balanceador de Render: req.ip = IP real del cliente
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true # Render genera un valor aleatorio de 256 bits
      - key: ENCRYPTION_KEY_CURRENT
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEYS
        sync: false
